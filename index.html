<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تست FTP — mzpr.ir</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      max-width: 32rem;
      margin: 3rem auto;
      padding: 1.5rem;
      line-height: 1.7;
      background: #f4f6f8;
      color: #1a1a1a;
    }
    .box {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    .ok { color: #0a6b2c; font-weight: bold; }
    code { background: #eee; padding: 0.15rem 0.4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>صفحه تست آپلود</h1>
    <p class="ok">اگر این متن را می‌بینید، فایل از پوشه <code>mzpr</code> به دامین دوم رسیده است.</p>
    <p>مسیر هاست: <code>/domains/mzpr.ir/public_html</code></p>
    <p>زمان محلی: <span id="t"></span></p>
  </div>
  <script>
    document.getElementById('t').textContent = new Date().toLocaleString('fa-IR');
  </script>
</body>
</html>
